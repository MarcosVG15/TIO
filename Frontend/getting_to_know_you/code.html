<script>
        function toggleSelection(element) {
            // Multiple selection allowed for cards
            element.classList.toggle('active');
            
            // Interaction effect
            if (element.classList.contains('active')) {
                const icon = element.querySelector('.material-symbols-outlined');
                icon.style.fontVariationSettings = "'FILL' 1";
            } else {
                const icon = element.querySelector('.material-symbols-outlined');
                icon.style.fontVariationSettings = "'FILL' 0";
            }
        }

        function togglePill(element) {
            // Radio style selection for pills
            const parent = element.parentElement;
            parent.querySelectorAll('.selection-pill').forEach(pill => {
                pill.classList.remove('bg-secondary', 'text-on-secondary', 'border-secondary');
                pill.classList.add('border-outline-variant');
            });
            
            element.classList.remove('border-outline-variant');
            element.classList.add('bg-secondary', 'text-on-secondary', 'border-secondary');
        }

        // Simple button click ripple/feedback
        document.getElementById('next-btn').addEventListener('click', function() {
            this.innerHTML = `
                <span class="material-symbols-outlined animate-spin">progress_activity</span>
                <span>Saving...</span>
            `;
            setTimeout(() => {
                alert('Your travel style has been saved! Proceeding to the next step.');
                location.reload(); // Simulate next step
            }, 1000);
        });
