services:
  db:
    # Postgres 16 with pgvector already compiled in - no CREATE EXTENSION
    # install step needed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tio_database
    ports:
      # 5433 on the host so this never clashes with a local Postgres.
      - "5433:5432"
    volumes:
      - tio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tio_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # Overrides whatever DATABASE_URL is in .env: inside the compose
      # network the database is reachable as "db", not as an external IP.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tio_database
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      # Inside the compose network the model is "ollama", not localhost.
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tio_database
    depends_on:
      db:
        condition: service_healthy

  ollama:
    # Runs the embedding model the location corpus was built with.
    # CPU-only on purpose: the GPU was needed to embed the corpus, but a
    # user is one paragraph at signup - about a second here. Nomic's
    # hosted API cannot serve v2-moe at all, so this is the only way to
    # produce vectors that match the corpus.
    #
    # The model is NOT in the image. After first start, once:
    #   docker compose exec ollama ollama pull nomic-embed-text-v2-moe
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      # ~1 GB of model weights. Without this every restart re-downloads.
      - tio_ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  tio_pgdata:
  tio_ollama:
