# Production stack for tio.agency.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is exposed to the internet. The API and the database are
# reachable solely from inside the compose network.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tio_database}
    volumes:
      - tio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tio_database}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to 127.0.0.1 so the port exists on the server's loopback only -
      # never on a public interface. Reach it with an SSH tunnel:
      #   ssh -L 5433:localhost:5433 ubuntu@tio.agency
      # Dropping the "127.0.0.1:" prefix would expose Postgres to the internet,
      # because Docker writes its own iptables rules and bypasses UFW.
      - "127.0.0.1:5433:5432"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tio_database}
    # --proxy-headers makes uvicorn trust Caddy's X-Forwarded-* headers, so
    # request.url is https and client IPs are the real ones.
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      # Inside the compose network the model is "ollama", not localhost.
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tio_database}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      # caddy_data holds the TLS certificates. Without this volume every
      # restart re-issues them and Let's Encrypt rate-limits you after five.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  ollama:
    # Runs the embedding model the location corpus was built with.
    # CPU-only on purpose: the GPU was needed to embed the corpus, but a
    # user is one paragraph at signup - about a second here. Nomic's
    # hosted API cannot serve v2-moe at all, so this is the only way to
    # produce vectors that match the corpus.
    #
    # The model is NOT in the image. After first start, once:
    #   docker compose exec ollama ollama pull nomic-embed-text-v2-moe
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      # ~1 GB of model weights. Without this every restart re-downloads.
      - tio_ollama:/root/.ollama
    expose:
      - "11434"

volumes:
  tio_pgdata:
  tio_ollama:
  caddy_data:
  caddy_config:
